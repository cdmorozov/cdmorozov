<svg width="520" height="420" viewBox="0 0 520 420" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="520" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <pattern id="grid2" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="520" height="420" rx="16" fill="url(#bg2)"/>
  <rect width="520" height="420" rx="16" fill="url(#grid2)"/>

  <!-- isometric stacked layers -->
  <g stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" fill="none">
    <!-- bottom layer (database) -->
    <g transform="translate(260 320)" stroke-opacity="0.55">
      <path d="M0 -40 110 25 0 90 -110 25Z" fill="#ffffff" fill-opacity="0.04"/>
      <path d="M0 -40 110 25 0 90 -110 25Z"/>
      <path d="M-110 25v22L0 112 110 47V25" stroke-opacity="0.35"/>
    </g>
    <!-- middle layer (server/api) -->
    <g transform="translate(260 215)" stroke-opacity="0.75">
      <path d="M0 -40 110 25 0 90 -110 25Z" fill="#ffffff" fill-opacity="0.06"/>
      <path d="M0 -40 110 25 0 90 -110 25Z"/>
      <path d="M-110 25v22L0 112 110 47V25" stroke-opacity="0.4"/>
    </g>
    <!-- top layer (UI) -->
    <g transform="translate(260 110)" stroke-opacity="1">
      <path d="M0 -40 110 25 0 90 -110 25Z" fill="#ffffff" fill-opacity="0.09"/>
      <path d="M0 -40 110 25 0 90 -110 25Z"/>
    </g>
  </g>

  <!-- connectors between layers -->
  <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="4 5">
    <path d="M260 150v25M260 255v25"/>
  </g>
  <g fill="#ffffff">
    <circle cx="260" cy="135" r="3.5"/>
    <circle cx="260" cy="240" r="3.5"/>
    <circle cx="260" cy="345" r="3.5"/>
  </g>

  <!-- code glyphs on top layer -->
  <g stroke="#ffffff" stroke-opacity="0.9" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M238 105l-12 10 12 10M282 105l12 10-12 10"/>
    <path d="M268 100l-14 30"/>
  </g>

  <text x="260" y="395" text-anchor="middle" fill="#ffffff" fill-opacity="0.6" font-size="14" letter-spacing="3">FRONTEND · API · DATABASE</text>
</svg>
