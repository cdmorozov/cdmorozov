<svg width="500" height="320" viewBox="0 0 500 320" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="500" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <pattern id="grid2" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#bg2)"/>
  <rect width="500" height="320" rx="16" fill="url(#grid2)"/>

  <!-- isometric stacked layers -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" fill="none">
    <!-- bottom layer (database) -->
    <g transform="translate(250 215)" stroke-opacity="0.55">
      <path d="M0 -30 90 20 0 70 -90 20Z" fill="#ffffff" fill-opacity="0.04"/>
      <path d="M0 -30 90 20 0 70 -90 20Z"/>
      <path d="M-90 20v18L0 88 90 38V20" stroke-opacity="0.35"/>
    </g>
    <!-- middle layer (server/api) -->
    <g transform="translate(250 140)" stroke-opacity="0.75">
      <path d="M0 -30 90 20 0 70 -90 20Z" fill="#ffffff" fill-opacity="0.06"/>
      <path d="M0 -30 90 20 0 70 -90 20Z"/>
      <path d="M-90 20v18L0 88 90 38V20" stroke-opacity="0.4"/>
    </g>
    <!-- top layer (UI) -->
    <g transform="translate(250 65)" stroke-opacity="1">
      <path d="M0 -30 90 20 0 70 -90 20Z" fill="#ffffff" fill-opacity="0.09"/>
      <path d="M0 -30 90 20 0 70 -90 20Z"/>
    </g>
  </g>

  <!-- connectors between layers -->
  <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.3" stroke-dasharray="4 5">
    <path d="M250 95v20M250 170v20"/>
  </g>
  <g fill="#ffffff">
    <circle cx="250" cy="85" r="3"/>
    <circle cx="250" cy="160" r="3"/>
    <circle cx="250" cy="235" r="3"/>
  </g>

  <!-- code glyphs on top layer -->
  <g stroke="#ffffff" stroke-opacity="0.9" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M232 60l-10 9 10 9M268 60l10 9-10 9"/>
    <path d="M256 55l-12 27"/>
  </g>

  <text x="250" y="300" text-anchor="middle" fill="#ffffff" fill-opacity="0.6" font-size="13" letter-spacing="3">FRONTEND · API · DATABASE</text>
</svg>
