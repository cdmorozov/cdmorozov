<svg width="1280" height="380" viewBox="0 0 1280 380" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1280" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="380" fill="url(#bg2)"/>
  <rect width="1280" height="380" fill="url(#grid2)"/>
  <ellipse cx="260" cy="190" rx="320" ry="260" fill="url(#glow2)"/>

  <!-- isometric stacked layers (left) -->
  <g stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" fill="none">
    <g transform="translate(260 290)" stroke-opacity="0.55">
      <path d="M0 -40 110 25 0 90 -110 25Z" fill="#ffffff" fill-opacity="0.04"/>
      <path d="M0 -40 110 25 0 90 -110 25Z"/>
      <path d="M-110 25v22L0 112 110 47V25" stroke-opacity="0.35"/>
    </g>
    <g transform="translate(260 185)" stroke-opacity="0.75">
      <path d="M0 -40 110 25 0 90 -110 25Z" fill="#ffffff" fill-opacity="0.06"/>
      <path d="M0 -40 110 25 0 90 -110 25Z"/>
      <path d="M-110 25v22L0 112 110 47V25" stroke-opacity="0.4"/>
    </g>
    <g transform="translate(260 80)" stroke-opacity="1">
      <path d="M0 -40 110 25 0 90 -110 25Z" fill="#ffffff" fill-opacity="0.09"/>
      <path d="M0 -40 110 25 0 90 -110 25Z"/>
    </g>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="4 5">
    <path d="M260 120v25M260 225v25"/>
  </g>
  <g fill="#ffffff">
    <circle cx="260" cy="105" r="3.5"/>
    <circle cx="260" cy="210" r="3.5"/>
    <circle cx="260" cy="315" r="3.5"/>
