  <!-- text (right) -->
  <text x="560" y="110" fill="#ffffff" font-size="40" font-weight="700" letter-spacing="-1">Fullstack development</text>
  <text x="560" y="160" fill="#ffffff" fill-opacity="0.8" font-size="20">
    <tspan x="560" dy="0">I build whole products: the interface people use and the APIs</tspan>
    <tspan x="560" dy="30">and database that sit underneath it. The code is clean and</tspan>
    <tspan x="560" dy="30">type-safe, and the screens load fast and stay out of your way.</tspan>
  </text>
  <text x="560" y="290" fill="#ffffff" fill-opacity="0.6" font-size="18">
    <tspan x="560" dy="0">Frontend · React · TypeScript · Next.js</tspan>
    <tspan x="560" dy="28">Backend · Node.js · Python · PostgreSQL</tspan>
  </text>
