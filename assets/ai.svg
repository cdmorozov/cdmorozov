<svg width="520" height="420" viewBox="0 0 520 420" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="520" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <pattern id="grid3" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="520" height="420" rx="16" fill="url(#bg3)"/>
  <rect width="520" height="420" rx="16" fill="url(#grid3)"/>

  <ellipse cx="260" cy="200" rx="180" ry="160" fill="url(#core)"/>

  <!-- neural network: 3 layers -->
  <!-- edges -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1">
    <!-- input(x=110) -> hidden(x=260) -->
    <path d="M110 110 260 90M110 110 260 200M110 110 260 310M110 200 260 90M110 200 260 200M110 200 260 310M110 290 260 90M110 290 260 200M110 290 260 310"/>
    <!-- hidden(x=260) -> output(x=410) -->
    <path d="M260 90 410 150M260 90 410 250M260 200 410 150M260 200 410 250M260 310 410 150M260 310 410 250"/>
  </g>

  <!-- nodes -->
  <g fill="#0a0a0a" stroke="#ffffff" stroke-width="1.8">
    <circle cx="110" cy="110" r="13"/>
    <circle cx="110" cy="200" r="13"/>
    <circle cx="110" cy="290" r="13"/>
    <circle cx="410" cy="150" r="13"/>
    <circle cx="410" cy="250" r="13"/>
  </g>
  <g fill="#ffffff" stroke="#ffffff" stroke-width="1.8">
    <circle cx="260" cy="90" r="15"/>
    <circle cx="260" cy="200" r="18"/>
    <circle cx="260" cy="310" r="15"/>
  </g>

  <!-- spark dots on edges -->
  <g fill="#ffffff">
    <circle cx="185" cy="155" r="2.5"/>
    <circle cx="335" cy="225" r="2.5"/>
    <circle cx="335" cy="120" r="2.5"/>
    <circle cx="185" cy="245" r="2.5"/>
  </g>

  <text x="260" y="395" text-anchor="middle" fill="#ffffff" fill-opacity="0.6" font-size="14" letter-spacing="3">LLM · AUTOMATION · AGENTS</text>
</svg>
