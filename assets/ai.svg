  <ellipse cx="1010" cy="190" rx="300" ry="240" fill="url(#core)"/>

  <!-- text (left) -->
  <text x="90" y="110" fill="#ffffff" font-size="40" font-weight="700" letter-spacing="-1">AI-powered solutions</text>
  <text x="90" y="160" fill="#ffffff" fill-opacity="0.8" font-size="20">
    <tspan x="90" dy="0">I help businesses get more done with AI: chatbots, automation</tspan>
    <tspan x="90" dy="30">that clears out repetitive work, assistants, and Telegram bots</tspan>
    <tspan x="90" dy="30">that actually handle tasks. Everything fits the tools you already</tspan>
    <tspan x="90" dy="30">run, and the results are easy to measure.</tspan>
  </text>
  <text x="90" y="320" fill="#ffffff" fill-opacity="0.6" font-size="18">LLM apps · Automation · Agents · Telegram bots</text>

  <!-- neural network (right) -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1">
