<svg width="500" height="320" viewBox="0 0 500 320" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="500" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <pattern id="grid3" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#bg3)"/>
  <rect width="500" height="320" rx="16" fill="url(#grid3)"/>

  <ellipse cx="250" cy="150" rx="170" ry="130" fill="url(#core)"/>

  <!-- neural network: 3 layers -->
  <!-- edges -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1">
    <path d="M110 80 250 70M110 80 250 150M110 80 250 230M110 150 250 70M110 150 250 150M110 150 250 230M110 220 250 70M110 220 250 150M110 220 250 230"/>
    <path d="M250 70 390 115M250 70 390 185M250 150 390 115M250 150 390 185M250 230 390 115M250 230 390 185"/>
  </g>

  <!-- nodes -->
  <g fill="#0a0a0a" stroke="#ffffff" stroke-width="1.7">
    <circle cx="110" cy="80" r="11"/>
    <circle cx="110" cy="150" r="11"/>
    <circle cx="110" cy="220" r="11"/>
    <circle cx="390" cy="115" r="11"/>
    <circle cx="390" cy="185" r="11"/>
  </g>
  <g fill="#ffffff" stroke="#ffffff" stroke-width="1.7">
    <circle cx="250" cy="70" r="13"/>
    <circle cx="250" cy="150" r="15"/>
    <circle cx="250" cy="230" r="13"/>
  </g>

  <!-- spark dots on edges -->
  <g fill="#ffffff">
    <circle cx="180" cy="115" r="2.3"/>
    <circle cx="320" cy="170" r="2.3"/>
    <circle cx="320" cy="92" r="2.3"/>
    <circle cx="180" cy="185" r="2.3"/>
  </g>

  <text x="250" y="300" text-anchor="middle" fill="#ffffff" fill-opacity="0.6" font-size="13" letter-spacing="3">LLM · AUTOMATION · AGENTS</text>
</svg>
