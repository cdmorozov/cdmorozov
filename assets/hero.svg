<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <rect width="1280" height="420" fill="url(#fade)"/>
  <ellipse cx="980" cy="210" rx="420" ry="320" fill="url(#glow)"/>

  <!-- decorative abstract geometry, right side -->
  <g stroke="#ffffff" stroke-opacity="0.55" fill="none" stroke-width="1.5">
    <circle cx="980" cy="210" r="150"/>
    <circle cx="980" cy="210" r="110"/>
    <circle cx="980" cy="210" r="70"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.25" fill="none" stroke-width="1">
    <path d="M830 210h300M980 60v300"/>
    <path d="M874 104l212 212M1086 104l-212 212"/>
  </g>
  <g fill="#ffffff">
    <circle cx="980" cy="60" r="4"/>
    <circle cx="980" cy="360" r="4"/>
    <circle cx="830" cy="210" r="4"/>
    <circle cx="1130" cy="210" r="4"/>
    <circle cx="980" cy="210" r="6"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.85">
    <circle cx="874" cy="104" r="3"/>
    <circle cx="1086" cy="104" r="3"/>
    <circle cx="874" cy="316" r="3"/>
    <circle cx="1086" cy="316" r="3"/>
  </g>

  <!-- left content -->
  <text x="90" y="120" fill="#ffffff" fill-opacity="0.55" font-size="18" letter-spacing="6">FULLSTACK · AI · WEB</text>
  <text x="88" y="210" fill="#ffffff" font-size="82" font-weight="700" letter-spacing="-2">Artem Morozov</text>
  <text x="92" y="258" fill="#ffffff" fill-opacity="0.7" font-size="26" font-weight="400">@cdmorozov</text>
  <line x1="92" y1="285" x2="540" y2="285" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="92" y="325" fill="#ffffff" fill-opacity="0.85" font-size="22">Building AI-powered apps, websites &amp; products for business.</text>

  <!-- stack chips -->
  <g font-size="15" fill="#ffffff">
    <g>
      <rect x="92" y="350" width="118" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="151" y="372" text-anchor="middle">TypeScript</text>
    </g>
    <g>
      <rect x="222" y="350" width="86" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="265" y="372" text-anchor="middle">React</text>
    </g>
    <g>
      <rect x="320" y="350" width="100" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="370" y="372" text-anchor="middle">Node.js</text>
    </g>
    <g>
      <rect x="432" y="350" width="86" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="475" y="372" text-anchor="middle">Python</text>
    </g>
    <g>
      <rect x="530" y="350" width="60" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="560" y="372" text-anchor="middle">AI</text>
    </g>
  </g>
</svg>
